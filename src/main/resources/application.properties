# =========================================================
# APPLICATION
# =========================================================

spring.application.name=incident-backend

server.port=${SERVER_PORT:8080}


# =========================================================
# DATABASE - MYSQL
# =========================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# FLYWAY
# =========================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


# =========================================================
# REDIS
# =========================================================

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s


# =========================================================
# KAFKA
# =========================================================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.consumer.group-id=incident-backend
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.incident

# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health,info,metrics

management.endpoint.health.show-details=always

management.health.redis.enabled=false
management.health.kafka.enabled=false

management.info.env.enabled=true


# =========================================================
# LOGGING
# =========================================================

logging.level.root=INFO
logging.level.com.incident=INFO

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n


# =========================================================
# APPLICATION INFO
# =========================================================

info.app.name=Incident
info.app.description=AI-powered production incident response system
info.app.version=0.0.1


# =========================================================
# CORS
# =========================================================

incident.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}


# =========================================================
# JWT
# =========================================================

incident.security.jwt.secret=${JWT_SECRET}
incident.security.jwt.expiration=${JWT_EXPIRATION:86400000}

incident.detection.interval-ms=10000


# =========================================================
# OpenAI
# =========================================================

openai.api-key=${OPENAI_API_KEY}
openai.model=${OPENAI_MODEL:gpt-5.6}

# AI investigation


ai.investigation.max-log-entries=100
ai.investigation.max-metric-entries=100
ai.investigation.max-deployment-entries=20
ai.investigation.max-previous-incidents=10