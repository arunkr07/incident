# =========================================================
# APPLICATION
# =========================================================

spring.application.name=incident-backend

server.port=${SERVER_PORT:8080}


# =========================================================
# DATABASE - MYSQL
# =========================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# FLYWAY
# =========================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


# =========================================================
# REDIS
# =========================================================

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}


# =========================================================
# KAFKA
# =========================================================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}


# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health,info,metrics

management.endpoint.health.show-details=always

management.health.redis.enabled=false
management.health.kafka.enabled=false

management.info.env.enabled=true


# =========================================================
# LOGGING
# =========================================================

logging.level.root=INFO
logging.level.com.incident=DEBUG

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n


# =========================================================
# APPLICATION INFO
# =========================================================

info.app.name=Incident
info.app.description=AI-powered production incident response system
info.app.version=0.0.1


# =========================================================
# CORS
# =========================================================

incident.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}