name: Incident CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: incident
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_USER: incident_user
          MYSQL_PASSWORD: ci_database_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
          --health-start-period=30s

      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      kafka:
        image: apache/kafka:4.0.1
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9092
          KAFKA_ADVERTISED_LISTENERS: INTERNAL://localhost:29092,EXTERNAL://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_NUM_PARTITIONS: 3
        options: >-
          --health-cmd="/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092"
          --health-interval=15s
          --health-timeout=10s
          --health-retries=15
          --health-start-period=30s

    env:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://127.0.0.1:3306/incident
      DB_USERNAME: incident_user
      DB_PASSWORD: ci_database_password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
      JWT_SECRET: ci_test_secret_key_at_least_32_characters_long
      JWT_EXPIRATION: 86400000
      CORS_ALLOWED_ORIGINS: http://localhost
      OPENAI_API_KEY: ci-placeholder-key
      OPENAI_MODEL: gpt-5.6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run backend tests
        run: ./mvnw -B test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  docker-build:
    name: Docker Image Builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - backend-test
      - frontend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t incident-backend:ci -f Dockerfile .

      - name: Build frontend image
        run: docker build -t incident-frontend:ci -f frontend/Dockerfile frontend